name: build image

# Compiling bark from source needs several GB of RAM. Doing that on the VPS
# starved Coolify of memory and took the whole host down, so the image is
# built here and the server only pulls it.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.build'
      - 'entrypoint.sh'
      - 'gateway/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: gateway tests
        working-directory: gateway
        run: bun install --frozen-lockfile || bun install && bun test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build
          push: true
          # The deployment host is a Hetzner ARM box; amd64 alone produced
          # "no match for platform in manifest" at deploy time.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/payment-agent:latest
            ghcr.io/${{ github.repository_owner }}/payment-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
